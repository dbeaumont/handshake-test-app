services:
  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    image: handshake/api-server:latest
    container_name: api-server
    environment:
      SERVER_SSL_KEYSTORE: /app/certs/server-keystore.p12
      SERVER_SSL_KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:-changeit}
      SERVER_SSL_TRUSTSTORE: /app/certs/server-truststore.p12
      SERVER_SSL_TRUSTSTORE_PASSWORD: ${TRUSTSTORE_PASSWORD:-changeit}
      SERVER_PORT: 8443
    volumes:
      - ./certs/generated:/app/certs:ro
    ports:
      - "8443:8443"

  api-client:
    build:
      context: ./api-client
      dockerfile: Dockerfile
    image: handshake/api-client:latest
    container_name: api-client
    environment:
      CLIENT_TRUSTSTORE: /app/certs/client-truststore.p12
      CLIENT_TRUSTSTORE_PASSWORD: ${CLIENT_TRUSTSTORE_PASSWORD:-changeit}
      DOWNSTREAM_BASE_URL: https://api-server:8443/api/hello
      CLIENT_PORT: 8080
    depends_on:
      - api-server
    volumes:
      - ./certs/generated:/app/certs:ro
    ports:
      - "8080:8080"
